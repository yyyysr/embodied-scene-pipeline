version: 1
# All lengths are meters; revolute limits/targets are degrees. Z-up.
gravity: [0, 0, -9.81]
materials:
  default:
    static_friction: 0.5
    dynamic_friction: 0.5
    restitution: 0.0
default_material: default
# References use registered Blender entity or internal reference IDs.
# Each dynamic body must have a distinct root with its collider descendants.
# Shared visual/collision meshes remain visible; dedicated proxies set hide_visual: true.
bodies: []
joints: []
# Explicitly list semantic roots intended only for appearance.
visual_only: []
