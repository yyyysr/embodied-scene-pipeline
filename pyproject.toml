[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-scene-pipeline"
version = "0.1.0"
description = "Agent-native Blender scene construction for embodied AI"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "usd-core>=26.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
review = ["Pillow>=10.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
