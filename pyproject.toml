[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-scene-pipeline"
version = "0.1.0"
description = "Agent-native Blender scene construction for embodied AI"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "usd-core>=26.8",
  "usd-convert-gsplat[usd]==0.1.15",
  "Pillow>=10.4",
  "numpy>=1.26",
  "coacd==1.0.14",
  "trimesh>=4.4,<5",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
editor = ["fastapi>=0.115", "uvicorn>=0.30", "ruamel.yaml>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
