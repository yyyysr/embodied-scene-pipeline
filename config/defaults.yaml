units: meters
up_axis: Z
render:
  engine: BLENDER_EEVEE_NEXT
  resolution_x: 640
  resolution_y: 480
  samples: 32
review:
  views: [overview, top, task]
  collection: __REVIEW__
paths:
  workspaces: workspaces
background_generation:
  clean_plate:
    backend: auto
    fal_provider: nano-banana
  world:
    provider: world_labs
    model: marble-1.1
    poll_interval_seconds: 15
    timeout_seconds: 1800
asset_generation:
  provider: hunyuan
  reference_image:
    fal_provider: nano-banana
  hunyuan:
    text_endpoint: fal-ai/hunyuan3d-v3/text-to-3d
    image_endpoint: fal-ai/hunyuan3d-v3/image-to-3d
    face_count: 50000
    enable_pbr: true
    generate_type: Normal
    polygon_type: triangle
    poll_interval_seconds: 10
    timeout_seconds: 1800
